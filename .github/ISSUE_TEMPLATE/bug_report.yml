name: Bug Report
description: Report a bug, crash, or unexpected behavior in any of the TZWorkQuint editors or launcher.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please verify your bug with a synthetic or non-sensitive document before submitting. **Do not paste API keys, passwords, or personal data.**
  - type: dropdown
    id: application
    attributes:
      label: Affected Application
      description: Which application in the TZWorkQuint suite is experiencing the issue?
      options:
        - "TZWorkQuint (Suite Launcher)"
        - "CellForge (Spreadsheets)"
        - "Wordloom (Word Processor)"
        - "SlideSpark (Presentations)"
        - "PDFlex (PDF Editor & Markup)"
        - "Draftline (2D CAD)"
        - "TZ Assistant / AI Gateway"
        - "Installer / Packaging / Deployment"
    validations:
      required: true
  - type: input
    id: suite_version
    attributes:
      label: Suite Version
      description: What version of TZWorkQuint are you running?
      placeholder: "e.g., 3.0.0"
      value: "3.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System & Architecture
      description: Select your host environment.
      options:
        - "Windows 11 (x64)"
        - "Windows 11 (ARM64)"
        - "Windows 10 (x64)"
        - "macOS Sonoma / Sequoia (Apple Silicon M-Series)"
        - "macOS Ventura / Sonoma (Intel x86_64)"
        - "Ubuntu / Debian (x86_64)"
        - "Ubuntu / Debian (ARM64)"
        - "Fedora / RHEL / Arch Linux"
        - "Other"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe the exact steps that trigger the issue.
      placeholder: |
        1. Launch CellForge.
        2. Open synthetic workbook.
        3. Select cells D4:D9.
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually occurred?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Crash Backtrace
      description: Copy relevant logs from your console or portable folder. (Please redact any private paths or tokens).
      render: shell

