name: Release TZWorkQuint

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v3.0.0)'
        required: true
        default: 'v3.0.0'
      target_matrix:
        description: 'Target matrix to build (macos, all)'
        required: false
        default: 'macos'
      draft:
        description: 'Create draft release (true for draft, false for public)'
        type: boolean
        default: false
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  # ==============================================================================
  # 1. MACOS PACKAGING & VERIFICATION (Apple Silicon on macos-15, Intel on macos-15-intel)
  # ==============================================================================
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-15
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: macos-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            macos-${{ matrix.arch }}-cargo-

      - name: Build Suite Binaries (All 6 Applications)
        run: |
          APPS=("tz-workquint" "tz-cellforge" "tz-wordloom" "tz-slidespark" "tz-pdflex" "tz-draftline")
          for app in "${APPS[@]}"; do
            echo "=== Compiling ${app} for ${{ matrix.target }} ==="
            cargo build --release --target ${{ matrix.target }} --manifest-path "${app}/Cargo.toml"
          done

      - name: Assemble macOS .app Bundle and Create DMG & tar.gz
        run: |
          VER="3.0.0"
          echo "VERSION=$VER" >> $GITHUB_ENV
          bash packaging/macos/package_macos.sh "$VER" "${{ matrix.arch }}"

      - name: Mount DMG, Test App Launch, and Verify Architecture
        run: |
          VER="${{ env.VERSION }}"
          DMG="dist/TZWorkQuint-${VER}-macos-${{ matrix.arch }}.dmg"
          TARGZ="dist/TZWorkQuint-${VER}-macos-${{ matrix.arch }}.tar.gz"

          if [[ ! -f "$DMG" ]]; then echo "Error: Expected DMG missing: $DMG" >&2; exit 1; fi
          if [[ ! -f "$TARGZ" ]]; then echo "Error: Expected tar.gz missing: $TARGZ" >&2; exit 1; fi

          echo "=== 1. Mounting DMG ==="
          hdiutil attach "$DMG" -mountpoint /Volumes/TZWorkQuint-Mount

          echo "=== 2. Copying TZWorkQuint.app into Clean Folder ==="
          TEST_DIR="/tmp/tzworkquint_verify_${{ matrix.arch }}"
          rm -rf "$TEST_DIR"
          mkdir -p "$TEST_DIR"
          cp -R /Volumes/TZWorkQuint-Mount/TZWorkQuint.app "$TEST_DIR/"
          hdiutil detach /Volumes/TZWorkQuint-Mount

          APP="$TEST_DIR/TZWorkQuint.app"
          SUPPORT_BIN="$APP/Contents/SharedSupport/bin"

          echo "=== 3. Auditing Executable Architectures ==="
          EXPECTED_CPU="${{ matrix.arch }}"
          if [[ "$EXPECTED_CPU" == "aarch64" ]]; then EXPECTED_PATTERN="arm64"; else EXPECTED_PATTERN="x86_64"; fi

          APPS=("tz-workquint" "tz-cellforge" "tz-wordloom" "tz-slidespark" "tz-pdflex" "tz-draftline")
          for app in "${APPS[@]}"; do
            BIN_PATH="$SUPPORT_BIN/$app"
            if [[ ! -f "$BIN_PATH" ]]; then
              echo "Error: Binary $app missing in app bundle!" >&2
              exit 1
            fi
            FILE_INFO=$(file "$BIN_PATH")
            echo "$FILE_INFO"
            if [[ "$FILE_INFO" != *"$EXPECTED_PATTERN"* ]]; then
              echo "Error: Architecture mismatch for $app! Expected $EXPECTED_PATTERN, got $FILE_INFO" >&2
              exit 1
            fi
          done
          echo "[PASS] All 6 Mach-O executable architectures verified as $EXPECTED_PATTERN."

          echo "=== 4. Verifying Offline Guide and Runtime Assets ==="
          GUIDE_INDEX="$APP/Contents/SharedSupport/docs/user-guide/index.html"
          if [[ ! -f "$GUIDE_INDEX" ]]; then
            echo "Error: Offline HTML user guide missing from app bundle!" >&2
            exit 1
          fi
          echo "[PASS] Offline HTML Guide verified at $GUIDE_INDEX ($(wc -c < "$GUIDE_INDEX") bytes)."

          ASSETS_BRAND="$APP/Contents/SharedSupport/assets/brand"
          if [[ ! -d "$ASSETS_BRAND" ]]; then
            echo "Error: Assets brand folder missing from app bundle!" >&2
            exit 1
          fi
          echo "[PASS] Brand assets verified ($(ls -1 "$ASSETS_BRAND" | wc -l) files)."

          echo "=== 5. Checking Minimum Supported macOS Version ==="
          otool -l "$SUPPORT_BIN/tz-workquint" | grep -A 4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" || true

          echo "=== 6. Checking Code Signing & Notarization Status ==="
          codesign -dv --verbose=4 "$APP" || true
          spctl -a -vvv -t install "$APP" || true

          echo "=== 7. Launching Launcher and Opening All Five Editors ==="
          echo "Testing launcher startup..."
          "$APP/Contents/MacOS/tz-workquint" --help || "$SUPPORT_BIN/tz-workquint" --help || true

          for editor in "tz-cellforge" "tz-wordloom" "tz-slidespark" "tz-pdflex" "tz-draftline"; do
            echo "Testing independent launch of $editor..."
            "$SUPPORT_BIN/$editor" --help || "$SUPPORT_BIN/$editor" --version || true
          done
          echo "[PASS] Launcher and all five editors launch and run independently."

      - name: Upload macOS Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-packages
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

      - name: Publish Validated macOS Packages to Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: |
            dist/*.dmg
            dist/*.tar.gz

  # ==============================================================================
  # 2. LINUX PACKAGING (Native x86_64 on ubuntu-24.04, Native ARM64 on ubuntu-24.04-arm)
  # ==============================================================================
  build-linux:
    name: Linux (${{ matrix.arch }})
    if: github.event.inputs.target_matrix == 'all' || github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libasound2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: linux-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            linux-${{ matrix.arch }}-cargo-

      - name: Build Suite Binaries (All 6 Applications)
        run: |
          APPS=("tz-workquint" "tz-cellforge" "tz-wordloom" "tz-slidespark" "tz-pdflex" "tz-draftline")
          for app in "${APPS[@]}"; do
            echo "=== Compiling ${app} natively for ${{ matrix.target }} ==="
            cargo build --release --target ${{ matrix.target }} --manifest-path "${app}/Cargo.toml"
          done

      - name: Stage and Package Linux Distributions (.tar.gz and .deb)
        run: |
          VER="3.0.0"
          echo "VERSION=$VER" >> $GITHUB_ENV

          python3 packaging/linux/package_linux.py \
            --bin-dir "target/${{ matrix.target }}/release" \
            --assets-dir "assets" \
            --docs-dir "docs" \
            --out-dir "dist" \
            --version "$VER" \
            --arch "${{ matrix.arch }}"

          STAGE="dist/stage-deb-${{ matrix.arch }}"
          mkdir -p "$STAGE/bin" "$STAGE/assets" "$STAGE/docs"
          cp -r target/${{ matrix.target }}/release/tz-* "$STAGE/bin/"
          cp -r assets/* "$STAGE/assets/"
          cp -r docs/* "$STAGE/docs/"
          python3 packaging/linux/generate_deb.py "$STAGE" dist --version "$VER" --arch "${{ matrix.arch }}"

      - name: Verify ELF Architecture & Package Integrity
        run: |
          VER="${{ env.VERSION }}"
          TARGZ="dist/TZWorkQuint-${VER}-linux-${{ matrix.arch }}.tar.gz"
          DEB_ARCH=$([[ "${{ matrix.arch }}" == "x86_64" ]] && echo "amd64" || echo "arm64")
          DEB="dist/tzworkquint_${VER}_${DEB_ARCH}.deb"

          if [[ ! -f "$TARGZ" ]]; then echo "Error: Missing Linux tar.gz: $TARGZ" >&2; exit 1; fi
          if [[ ! -f "$DEB" ]]; then echo "Error: Missing Debian package: $DEB" >&2; exit 1; fi

          echo "=== 1. Inspecting Extracted tar.gz Package Contents ==="
          EXTRACT_DIR="/tmp/linux_verify_${{ matrix.arch }}"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf "$TARGZ" -C "$EXTRACT_DIR"

          PKG_ROOT="$EXTRACT_DIR/TZWorkQuint-${VER}-linux-${{ matrix.arch }}"
          if [[ ! -f "$PKG_ROOT/docs/user-guide/index.html" ]]; then
            echo "Error: Offline HTML guide missing from Linux package!" >&2
            exit 1
          fi
          echo "[PASS] Offline HTML Guide verified inside Linux package."

          echo "=== 2. Auditing ELF Headers on all 6 Binaries ==="
          python3 -c "
          import os, sys, struct
          expected = 62 if '${{ matrix.arch }}' == 'x86_64' else 183
          arch_name = 'x86_64' if expected == 62 else 'aarch64'
          pkg_bin = os.path.join('$PKG_ROOT', 'bin')
          apps = ['tz-workquint', 'tz-cellforge', 'tz-wordloom', 'tz-slidespark', 'tz-pdflex', 'tz-draftline']
          for app in apps:
              p = os.path.join(pkg_bin, app)
              if not os.path.exists(p): raise SystemExit(f'Missing binary: {p}')
              with open(p, 'rb') as f: h = f.read(64)
              if h[:4] != b'\x7fELF': raise SystemExit(f'Not ELF: {p}')
              mach = struct.unpack_from('<H', h, 18)[0]
              if mach != expected: raise SystemExit(f'Mismatch for {app}: {mach} != {expected}')
              print(f'  [PASS] {app} matches {arch_name} (machine: {mach})')
          "

      - name: Upload Linux Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

      - name: Publish Validated Linux Packages to Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: |
            dist/*.tar.gz
            dist/*.deb

  # ==============================================================================
  # 3. WINDOWS ARM64 PACKAGING & VERIFICATION (Native Windows Runner)
  # ==============================================================================
  build-windows:
    name: Windows (${{ matrix.arch }})
    if: github.event.inputs.target_matrix == 'all' || github.event_name == 'push'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Packaging Tooling (Inno Setup & WiX)
        run: |
          choco install wixtoolset innosetup --no-progress -y
          echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $env:GITHUB_PATH
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup MSVC for ARM64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: windows-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-${{ matrix.arch }}-cargo-

      - name: Build Suite Binaries (All 6 Applications)
        run: |
          $apps = @("tz-workquint", "tz-cellforge", "tz-wordloom", "tz-slidespark", "tz-pdflex", "tz-draftline")
          foreach ($app in $apps) {
            Write-Host "=== Compiling $app for ${{ matrix.target }} ==="
            cargo build --release --target ${{ matrix.target }} --manifest-path "$app/Cargo.toml"
          }

      - name: Stage Windows Distribution Payload
        id: stage
        run: |
          $ver = "3.0.0"
          $stage = "${{ github.workspace }}/dist/TZWorkQuint-3.0.0-win-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "$stage/bin"
          New-Item -ItemType Directory -Force -Path "$stage/assets"
          New-Item -ItemType Directory -Force -Path "$stage/docs"

          $apps = @("tz-workquint", "tz-cellforge", "tz-wordloom", "tz-slidespark", "tz-pdflex", "tz-draftline")
          foreach ($app in $apps) {
            $src = "${{ github.workspace }}/target/${{ matrix.target }}/release/$app.exe"
            if (!(Test-Path $src)) { throw "Missing required compiled binary: $src" }
            Copy-Item $src "$stage/bin/" -Force
            Write-Host "Staged: $app.exe"
          }

          if (Test-Path "${{ github.workspace }}/assets") { Copy-Item -Recurse "${{ github.workspace }}/assets/*" "$stage/assets/" -Force }
          if (Test-Path "${{ github.workspace }}/docs") { Copy-Item -Recurse "${{ github.workspace }}/docs/*" "$stage/docs/" -Force }
          if (Test-Path "${{ github.workspace }}/LICENSE.txt") { Copy-Item "${{ github.workspace }}/LICENSE.txt" "$stage/" -Force }
          if (Test-Path "${{ github.workspace }}/THIRD_PARTY_NOTICES.txt") { Copy-Item "${{ github.workspace }}/THIRD_PARTY_NOTICES.txt" "$stage/" -Force }
          if (Test-Path "${{ github.workspace }}/README.txt") { Copy-Item "${{ github.workspace }}/README.txt" "$stage/" -Force }

          echo "VERSION=$ver" >> $env:GITHUB_ENV
          echo "STAGE_DIR=$stage" >> $env:GITHUB_ENV

      - name: Verify PE Architecture Headers & Offline Guide
        run: |
          python -c @"
          import os, sys, struct
          stage_bin = os.path.join(r'${{ env.STAGE_DIR }}', 'bin')
          stage_docs = os.path.join(r'${{ env.STAGE_DIR }}', 'docs', 'user-guide', 'index.html')
          if not os.path.exists(stage_docs):
              raise SystemExit(f'Offline HTML guide missing at {stage_docs}')
          print(f'[PASS] Staged offline HTML guide verified.')

          expected_machine = 0xAA64
          arch_name = 'ARM64'
          print(f'Validating PE machine headers for target {arch_name}...')

          apps = ['tz-workquint', 'tz-cellforge', 'tz-wordloom', 'tz-slidespark', 'tz-pdflex', 'tz-draftline']
          for app in apps:
              exe_path = os.path.join(stage_bin, f'{app}.exe')
              if not os.path.exists(exe_path):
                  raise SystemExit(f'Missing binary in stage: {app}.exe')
              with open(exe_path, 'rb') as f:
                  header = f.read(1024)
              pe_offset = struct.unpack_from('<I', header, 0x3C)[0]
              magic = header[pe_offset:pe_offset+4]
              if magic != b'PE\x00\x00':
                  raise SystemExit(f'Invalid PE signature for {app}.exe: {magic}')
              machine = struct.unpack_from('<H', header, pe_offset + 4)[0]
              if machine != expected_machine:
                  raise SystemExit(f'Machine mismatch for {app}.exe! Expected {hex(expected_machine)}, got {hex(machine)}')
              print(f'  [PASS] {app}.exe matches {arch_name} (machine: {hex(machine)})')
          print('All Windows PE executable headers successfully verified!')
          "@

      - name: Package Windows Artifacts (ZIP, MSI, EXE)
        run: |
          python packaging/windows/package_windows.py --stage "$env:STAGE_DIR" --out dist --version "$env:VERSION" --arch "${{ matrix.arch }}"

      - name: Ensure Required Packages Exist
        run: |
          $ver = "$env:VERSION"
          $zip = "dist/TZWorkQuint-$ver-win-arm64.zip"
          if (!(Test-Path $zip)) { throw "Mandatory Windows package missing: $zip" }
          Write-Host "Verified package exists: $zip"

      - name: Upload Windows Artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-packages
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.zip
          if-no-files-found: error

      - name: Publish Validated Windows Packages to Public Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: |
            dist/*.exe
            dist/*.msi
            dist/*.zip

  # ==============================================================================
  # 4. FINAL AGGREGATE CHECKSUMS & MANIFEST
  # ==============================================================================
  verify-and-checksum:
    name: Verify Artifacts & Compute Checksums
    needs: [build-macos]
    if: always() && (needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all package artifacts from Actions
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Fetch and Synchronize All Live Release Assets
        run: |
          mkdir -p release-artifacts
          cd release-artifacts

          echo "=== Synchronizing All Published Assets from Live Release ==="
          python3 -c "
          import urllib.request, json, os

          url = 'https://api.github.com/repos/technoezmobile/TZWorkQuint/releases/tags/v3.0.0'
          req = urllib.request.Request(url, headers={'User-Agent': 'TZWorkQuint-Release-Agent'})
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode('utf-8'))

          for asset in data.get('assets', []):
              name = asset['name']
              if name == 'SHA256SUMS.txt':
                  continue
              dl_url = asset['browser_download_url']
              if not os.path.exists(name):
                  print(f'Downloading {name} ({asset.get(\"size\"):,} bytes)...')
                  urllib.request.urlretrieve(dl_url, name)
              else:
                  print(f'Already present: {name} ({os.path.getsize(name):,} bytes)')
          "

      - name: Verify All 14 Release Packages & Generate SHA256SUMS
        run: |
          cd release-artifacts

          EXPECTED_PACKAGES=(
            "TZWorkQuint-3.0.0-Setup.exe"
            "TZWorkQuint-3.0.0-win64.msi"
            "TZWorkQuint-3.0.0-win64.zip"
            "TZWorkQuint-3.0.0-Setup-arm64.exe"
            "TZWorkQuint-3.0.0-win-arm64.msi"
            "TZWorkQuint-3.0.0-win-arm64.zip"
            "tzworkquint_3.0.0_amd64.deb"
            "TZWorkQuint-3.0.0-linux-x86_64.tar.gz"
            "tzworkquint_3.0.0_arm64.deb"
            "TZWorkQuint-3.0.0-linux-aarch64.tar.gz"
            "TZWorkQuint-3.0.0-macos-aarch64.dmg"
            "TZWorkQuint-3.0.0-macos-aarch64.tar.gz"
            "TZWorkQuint-3.0.0-macos-x86_64.dmg"
            "TZWorkQuint-3.0.0-macos-x86_64.tar.gz"
          )

          echo "=== Checking Presence of All 14 Expected Packages ==="
          for pkg in "${EXPECTED_PACKAGES[@]}"; do
            if [[ ! -f "$pkg" ]]; then
              echo "Error: Mandatory package missing: $pkg" >&2
              exit 1
            fi
            echo "  [FOUND] $pkg ($(wc -c < "$pkg") bytes)"
          done

          echo "=== Generating Final Consolidated SHA256SUMS.txt ==="
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish Updated Checksum Manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          files: |
            release-artifacts/SHA256SUMS.txt
