<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgDraft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="compassMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadowDraft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#451A03" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base (Amber) -->
  <rect width="512" height="512" rx="108" fill="url(#bgDraft)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#FBBF24" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Blueprint Background Grid Lines -->
  <g stroke="#FDE68A" stroke-width="1.5" stroke-opacity="0.2">
    <circle cx="256" cy="256" r="180" fill="none"/>
    <circle cx="256" cy="256" r="120" fill="none" stroke-dasharray="8 8"/>
    <line x1="76" y1="256" x2="436" y2="256"/>
    <line x1="256" y1="76" x2="256" y2="436"/>
    <path d="M 128 384 A 180 180 0 0 1 384 384" fill="none" stroke-width="3" stroke="#FDE68A" stroke-opacity="0.4"/>
  </g>

  <!-- Drafting Compass Instrument (Concept 02 Amber) -->
  <g filter="url(#shadowDraft)">
    <!-- Top Hinge Knurled Handle -->
    <rect x="246" y="70" width="20" height="46" rx="6" fill="url(#compassMetal)"/>
    <circle cx="256" cy="136" r="28" fill="url(#compassMetal)"/>
    <circle cx="256" cy="136" r="12" fill="#78350F"/>

    <!-- Left Leg (Needle Leg) -->
    <path d="M 244 146 L 156 360 L 166 364 L 254 150 Z" fill="url(#compassMetal)"/>
    <!-- Needle Point -->
    <polygon points="156,360 166,364 158,416" fill="#FFFFFF"/>

    <!-- Right Leg (Pencil/Pen Leg) -->
    <path d="M 268 146 L 356 360 L 346 364 L 258 150 Z" fill="url(#compassMetal)"/>
    <!-- Pen / Ruling Nib Tip -->
    <polygon points="356,360 346,364 354,416" fill="#FFFFFF"/>

    <!-- Compass Measuring Adjustment Crossbar / Spindle -->
    <line x1="184" y1="270" x2="328" y2="270" stroke="url(#compassMetal)" stroke-width="10" stroke-linecap="round"/>
    <!-- Center Adjustment Thumbwheel -->
    <rect x="242" y="258" width="28" height="24" rx="4" fill="#FFFFFF"/>
    <line x1="256" y1="258" x2="256" y2="282" stroke="#78350F" stroke-width="3"/>
  </g>
</svg>

