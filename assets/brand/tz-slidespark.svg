<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgSlide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#845EF7"/>
      <stop offset="50%" stop-color="#7048E8"/>
      <stop offset="100%" stop-color="#5F3DC4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C2889" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2D1264" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="shadowSlide" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#21094E" flood-opacity="0.5"/>
    </filter>
    <filter id="playGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#FFFFFF" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base (Purple) -->
  <rect width="512" height="512" rx="108" fill="url(#bgSlide)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#B197FC" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Presentation Slide Canvas Card (16:9 Aspect ratio) -->
  <g filter="url(#shadowSlide)">
    <!-- Slide Card Shell -->
    <rect x="76" y="116" width="360" height="280" rx="28" fill="url(#cardGrad)" stroke="#D0BFFF" stroke-width="5" stroke-opacity="0.8"/>
    
    <!-- Header Accent Bar -->
    <path d="M 76 144 A 28 28 0 0 1 104 116 L 408 116 A 28 28 0 0 1 436 144 L 436 160 L 76 160 Z" fill="#9775FA" fill-opacity="0.4"/>

    <!-- Subtle Presentation Stage Lines -->
    <line x1="110" y1="138" x2="190" y2="138" stroke="#E599F7" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="360" x2="250" y2="360" stroke="#B197FC" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>
    <circle cx="400" cy="138" r="5" fill="#E599F7"/>

    <!-- Clear, Crisp, Solid White PLAY TRIANGLE (Concept 02) -->
    <g filter="url(#playGlow)">
      <!-- Play Button Enclosure Circle -->
      <circle cx="256" cy="256" r="64" fill="#6741D9" stroke="#E599F7" stroke-width="4"/>
      <!-- Pure White Play Triangle -->
      <polygon points="236,214 300,256 236,298" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Spark Accents (SlideSpark Energy) -->
  <path d="M 96 90 Q 106 100 116 90 Q 106 80 96 90 Z" fill="#FFFFFF"/>
  <path d="M 400 395 Q 412 405 424 395 Q 412 385 400 395 Z" fill="#FFFFFF"/>
</svg>

