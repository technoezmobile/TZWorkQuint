<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2029"/>
      <stop offset="100%" stop-color="#0F1015"/>
    </linearGradient>
    <linearGradient id="tzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#748FFC"/>
      <stop offset="50%" stop-color="#5C7CFA"/>
      <stop offset="100%" stop-color="#4C6EF5"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E03131"/>
      <stop offset="25%" stop-color="#1971C2"/>
      <stop offset="50%" stop-color="#2F9E44"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#7950F2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4C6EF5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#2D313F" stroke-width="3"/>

  <!-- Main Suite Typography (No family crest; text TZWorkQuint) -->
  <g filter="url(#glow)">
    <!-- Primary Monogram TZ -->
    <text x="256" y="240" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="180" font-weight="900" text-anchor="middle" fill="url(#tzGrad)" letter-spacing="4">TZ</text>
  </g>

  <!-- Wordmark "WorkQuint" -->
  <text x="256" y="330" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="52" font-weight="700" text-anchor="middle" fill="#FFFFFF" letter-spacing="3">WorkQuint</text>
  <text x="256" y="375" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#909296" letter-spacing="8">PRODUCTIVITY SUITE</text>

  <!-- Quint-App Identity Accent Spectrum -->
  <rect x="136" y="415" width="240" height="6" rx="3" fill="url(#lineGrad)"/>
  
  <!-- Five Dots for the Five Suite Applications -->
  <circle cx="160" cy="442" r="7" fill="#E03131"/> <!-- PDFlex (Red) -->
  <circle cx="208" cy="442" r="7" fill="#1971C2"/> <!-- Wordloom (Blue) -->
  <circle cx="256" cy="442" r="7" fill="#2F9E44"/> <!-- CellForge (Green) -->
  <circle cx="304" cy="442" r="7" fill="#D97706"/> <!-- Draftline (Amber) -->
  <circle cx="352" cy="442" r="7" fill="#7950F2"/> <!-- SlideSpark (Purple) -->
</svg>

