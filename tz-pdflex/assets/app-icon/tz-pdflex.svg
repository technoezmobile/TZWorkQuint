<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgPdf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA5252"/>
      <stop offset="50%" stop-color="#E03131"/>
      <stop offset="100%" stop-color="#C92A2A"/>
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F3F5"/>
    </linearGradient>
    <filter id="shadowPdf" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#5C0000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base (Red) -->
  <rect width="512" height="512" rx="108" fill="url(#bgPdf)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#FFA8A8" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Document Sheet with Folded Corner -->
  <g filter="url(#shadowPdf)">
    <!-- Main Sheet Path -->
    <path d="M 128 80 L 304 80 L 384 160 L 384 432 L 128 432 Z" rx="16" fill="url(#sheetGrad)"/>
    <!-- Folded Corner Flap -->
    <path d="M 304 80 L 304 160 L 384 160 Z" fill="#DEE2E6"/>
    <path d="M 304 160 L 384 160 L 304 80 Z" fill="#CED4DA" fill-opacity="0.5"/>

    <!-- PDF Text Lines and Reading Blocks -->
    <rect x="168" y="196" width="176" height="18" rx="6" fill="#FA5252"/>
    <rect x="168" y="234" width="140" height="14" rx="5" fill="#ADB5BD"/>
    <rect x="168" y="264" width="176" height="14" rx="5" fill="#ADB5BD"/>
    <rect x="168" y="294" width="120" height="14" rx="5" fill="#ADB5BD"/>

    <!-- Red Document Seal / Badge -->
    <circle cx="280" cy="356" r="32" fill="#E03131"/>
    <circle cx="280" cy="356" r="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text x="280" y="362" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#FFFFFF">PDF</text>
  </g>
</svg>

