<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgWord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#228BE6"/>
      <stop offset="50%" stop-color="#1971C2"/>
      <stop offset="100%" stop-color="#1864AB"/>
    </linearGradient>
    <linearGradient id="nibMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E7F5FF"/>
      <stop offset="100%" stop-color="#A5D8FF"/>
    </linearGradient>
    <filter id="shadowWord" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0B3C68" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Base (Cobalt Blue) -->
  <rect width="512" height="512" rx="108" fill="url(#bgWord)"/>
  <rect x="8" y="8" width="496" height="496" rx="100" fill="none" stroke="#74C0FC" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Flowing Page Curves -->
  <path d="M 96 160 C 180 120, 332 200, 416 160" stroke="#74C0FC" stroke-width="4" stroke-linecap="round" fill="none" stroke-opacity="0.3"/>
  <path d="M 96 352 C 180 312, 332 392, 416 352" stroke="#74C0FC" stroke-width="4" stroke-linecap="round" fill="none" stroke-opacity="0.3"/>

  <!-- Stylized Pen Nib (Wordloom Emblem) -->
  <g filter="url(#shadowWord)">
    <!-- Main Nib Body -->
    <path d="M 256 96 C 296 180, 356 220, 356 320 C 356 360, 320 376, 256 384 C 192 376, 156 360, 156 320 C 156 220, 216 180, 256 96 Z" fill="url(#nibMetal)"/>
    
    <!-- Breather Hole -->
    <circle cx="256" cy="276" r="18" fill="#1864AB"/>
    
    <!-- Ink Slit / Channel -->
    <line x1="256" y1="96" x2="256" y2="258" stroke="#1864AB" stroke-width="6" stroke-linecap="round"/>

    <!-- Decorative Engraving on Nib Wings -->
    <path d="M 216 280 Q 210 320 186 332" stroke="#1971C2" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 296 280 Q 302 320 326 332" stroke="#1971C2" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>

